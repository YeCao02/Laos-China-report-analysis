[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laos-china-media-corpus"
version = "0.1.0"
description = "Auditable KPL and Pasaxon China-related news corpus pipeline"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
ocr = ["liteparse==2.0.0"]
pdf = ["pdfplumber>=0.11", "pypdf>=5"]

[project.scripts]
laos-china-corpus = "laos_china_corpus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
